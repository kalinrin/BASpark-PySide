name: Build BASpark-PySide

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # 自建 Python 的版本与分发地址，升级时只改这两行
  PY_VERSION: "3.12.14"
  PY_DIST_BASE: "https://gls.kafornet.online/python"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: BASpark-windows-64
            py_platform: win64
            py_ext: zip          # 包内直接是 python.exe / Lib，没有父目录
          - os: macos-26
            artifact_name: BASpark-macos-arm64
            mac_arch: arm64
            # 不要下调：PySide6 6.11 的绑定层（libpyside6 / libshiboken6 / PySide6/*.so）
            # 本身就是 minos 15.0（Qt 插件才是 13.0），下限由 wheel 决定，调低只会
            # 产生链接警告 + 让 Info.plist 的 LSMinimumSystemVersion 谎报版本。
            # 真要降低门槛，唯一的办法是钉一个更老的 PySide6 版本。
            deployment_target: "15.0"
            py_platform: macos-arm64
            py_ext: tar.gz       # 包内套一层 python-<ver>/，里面才是 bin、lib

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up custom Python (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url  = "$env:PY_DIST_BASE/$env:PY_VERSION/python-$env:PY_VERSION-${{ matrix.py_platform }}.${{ matrix.py_ext }}"
          $zip  = "$env:RUNNER_TEMP\python.zip"
          $root = "$env:RUNNER_TEMP\python"

          Write-Host "Downloading $url"
          curl.exe -fL --retry 3 --retry-delay 5 -o "$zip" "$url"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          # bsdtar 解 zip 比 Expand-Archive 快得多，失败再回退
          $extracted = $false
          try {
            tar -xf "$zip" -C "$root"
            if ($LASTEXITCODE -eq 0) { $extracted = $true }
          } catch { $extracted = $false }
          if (-not $extracted) {
            Write-Host "bsdtar 解压失败，回退 Expand-Archive"
            Expand-Archive -Path $zip -DestinationPath $root -Force
          }

          # 当前分发包解开就是 python.exe / Lib，这段只是兜底：万一以后多套了一层目录
          if (-not (Test-Path "$root\python.exe")) {
            $inner = Get-ChildItem $root -Directory |
                     Where-Object { Test-Path "$($_.FullName)\python.exe" } |
                     Select-Object -First 1
            if ($inner) { $root = $inner.FullName }
          }
          if (-not (Test-Path "$root\python.exe")) {
            Write-Host "::error::未在 $root 找到 python.exe"
            Get-ChildItem $root | Select-Object Name | Out-String | Write-Host
            exit 1
          }

          # PC\layout 的 embed 预设才会生成 ._pth（它会禁用 site-packages）；default 预设没有，这里只是兜底
          Get-ChildItem $root -Filter "*._pth" -ErrorAction SilentlyContinue | Remove-Item -Force

          # Nuitka 是真编译真链接，缺一样都跑不通，提前告警好定位
          if (-not (Test-Path "$root\include\Python.h")) { Write-Host "::warning::缺少 include\Python.h（PC\layout 需带 --include-dev / --preset-default）" }
          if (-not (Get-ChildItem "$root\libs" -Filter "python3*.lib" -ErrorAction SilentlyContinue)) { Write-Host "::warning::缺少 libs\python3*.lib，Nuitka 无法链接" }
          if (-not (Test-Path "$root\Lib\os.py")) { Write-Host "::warning::Lib 下没有 .py 源码（只有 .pyc？）Nuitka 需要源码" }

          Write-Host "==== Python root: $root ===="
          Get-ChildItem $root | Select-Object Name | Out-String | Write-Host
          & "$root\python.exe" -VV

          # 放到 PATH 最前面，覆盖 runner 自带的 Python
          "$root"          | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$root\Scripts"  | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PYTHON_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up custom Python (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          url="$PY_DIST_BASE/$PY_VERSION/python-$PY_VERSION-${{ matrix.py_platform }}.${{ matrix.py_ext }}"
          pkg="$RUNNER_TEMP/python.${{ matrix.py_ext }}"
          root="$RUNNER_TEMP/python"

          echo "Downloading $url"
          curl -fL --retry 3 --retry-delay 5 -o "$pkg" "$url"
          rm -rf "$root"; mkdir -p "$root"

          # 首选 bsdtar：一步解开 .tar.gz，且完整保留符号链接与可执行位
          extract_ok=0
          if tar -xzf "$pkg" -C "$root"; then extract_ok=1; fi

          # 回退 7zz：它不认 .tar.gz 的两层结构，必须解两次（.tar.gz -> .tar -> python-<ver>/）
          if [ "$extract_ok" -eq 0 ] && command -v 7zz >/dev/null 2>&1; then
            echo "tar 解压失败，回退 7zz"
            7zz x -y -o"$root" "$pkg" >/dev/null
            inner="$(find "$root" -maxdepth 1 -type f -name '*.tar' | head -n 1 || true)"
            if [ -n "$inner" ]; then
              7zz x -y -o"$root" "$inner" >/dev/null
              rm -f "$inner"
              extract_ok=1
            fi
          fi

          # 最后再兜一层 gzip + tar
          if [ "$extract_ok" -eq 0 ]; then
            gzip -dc "$pkg" | tar -xf - -C "$root" && extract_ok=1
          fi
          if [ "$extract_ok" -eq 0 ]; then
            echo "::error::解压 $pkg 失败"; ls -la "$root"; exit 1
          fi

          echo "==== 解压结果 ===="
          ls -la "$root"

          # 定位真正的 Python 主目录（tar 包里套着一层 python-<ver>/）
          pyroot=""
          for d in "$root" "$root"/*; do
            [ -d "$d" ] || continue
            if [ -e "$d/bin/python3" ]; then pyroot="$d"; break; fi
          done
          if [ -z "$pyroot" ]; then
            while IFS= read -r b; do
              if [ -e "$b/python3" ]; then pyroot="$(dirname "$b")"; break; fi
            done < <(find "$root" -maxdepth 4 -type d -name bin)
          fi
          if [ -z "$pyroot" ]; then
            echo "::error::未找到 bin/python3，解压结果如下："
            find "$root" -maxdepth 3 | head -n 60
            exit 1
          fi

          bindir="$pyroot/bin"
          chmod -R u+w "$pyroot" || true
          chmod +x "$bindir"/* 2>/dev/null || true
          xattr -dr com.apple.quarantine "$pyroot" 2>/dev/null || true

          # make install 只生成 python3，这里补一个 python 软链，两个平台命令就能统一
          if [ ! -e "$bindir/python" ]; then ln -s "$bindir/python3" "$bindir/python"; fi

          # 搬家后 sysconfig 里记的仍是编译期 prefix（Nuitka 找 libpython/头文件、
          # bin/pip3 的 shebang 都依赖它），做个同名软链最省事
          build_prefix="$("$bindir/python3" -c 'import sysconfig;print(sysconfig.get_config_var("prefix") or "")' 2>/dev/null || true)"
          if [ -n "$build_prefix" ] && [ "$build_prefix" != "$pyroot" ] && [ ! -e "$build_prefix" ]; then
            sudo mkdir -p "$(dirname "$build_prefix")" 2>/dev/null || true
            sudo ln -s "$pyroot" "$build_prefix" 2>/dev/null && echo "compat symlink: $build_prefix -> $pyroot" || true
          fi

          # arm64 上没有有效签名的 Mach-O 会被直接 SIGKILL，跑不起来就 ad-hoc 重签一次
          if ! "$bindir/python3" -VV; then
            echo "::warning::python3 无法执行，尝试 ad-hoc 重新签名"
            find "$pyroot" -type f \( -name '*.dylib' -o -name '*.so' -o -perm -u+x \) -print0 \
              | xargs -0 -n 40 codesign --force --sign - 2>/dev/null || true
            "$bindir/python3" -VV
          fi

          # Nuitka 需要头文件与 libpython
          [ -e "$pyroot/include/python3.12/Python.h" ] || echo "::warning::缺少 include/python3.12/Python.h"
          ls "$pyroot"/lib/libpython3.12.* >/dev/null 2>&1 || echo "::warning::$pyroot/lib 下没有 libpython3.12.*"

          echo "==== Python root: $pyroot ===="
          ls -la "$pyroot"

          echo "$bindir" >> "$GITHUB_PATH"
          echo "PYTHON_ROOT=$pyroot" >> "$GITHUB_ENV"

      - name: Bootstrap pip
        shell: bash
        run: |
          set -euo pipefail
          which python
          python -VV
          python -c "import sys; print(sys.executable); print(sys.prefix)"
          # 关键模块自检：mac 那份用的是静态 openssl/lzma，顺便验证整棵树搬家后仍然可用
          python -c "import ssl, lzma, sqlite3, ctypes, zlib, bz2, hashlib; print('modules OK', ssl.OPENSSL_VERSION)"
          # 全程用 python -m pip：mac 包里的 bin/pip3 shebang 写死了编译期前缀，直接调用可能失败
          python -m pip --version || python -m ensurepip --default-pip
          python -m pip --version
          python -m pip install --upgrade pip
          python -m pip --version

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install nuitka zstandard imageio
          python -m pip list

      - name: Build Windows
        if: runner.os == 'Windows'
        run: >
          python -m nuitka --onefile
          --windows-console-mode=disable
          --windows-uac-admin
          --assume-yes-for-downloads
          --output-dir=dist
          --output-filename=BASpark
          --enable-plugin=pyside6
          --noinclude-qt-translations
          --include-data-dir=web=web
          --include-data-files=app.ico=app.ico
          --windows-icon-from-ico=app.ico
          --python-flag=no_asserts
          --python-flag=no_docstrings
          --lto=yes
          --nofollow-import-to=PySide6.Qt3DCore
          --nofollow-import-to=PySide6.Qt3DRender
          --nofollow-import-to=PySide6.QtQml
          --nofollow-import-to=PySide6.QtQuick
          --nofollow-import-to=PySide6.QtSql
          --nofollow-import-to=PySide6.QtSensors
          --nofollow-import-to=PySide6.QtBluetooth
          --nofollow-import-to=PySide6.QtNfc
          --nofollow-import-to=PySide6.QtMultimedia
          --nofollow-import-to=PySide6.QtMultimediaWidgets
          --nofollow-import-to=PySide6.QtPositioning
          --nofollow-import-to=PySide6.QtTest
          --nofollow-import-to=PySide6.QtXml
          main.py

      - name: Prepare Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "dist/main.exe") { Rename-Item "dist/main.exe" "BASpark.exe" }
          if (Test-Path "dist/BASpark.exe") { Move-Item "dist/BASpark.exe" "./BASpark.exe" }

      - name: Build macOS
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: >
          python -m nuitka --standalone
          --macos-create-app-bundle
          --macos-app-name=BASpark
          --macos-app-mode=gui
          --macos-target-arch=${{ matrix.mac_arch }}
          --assume-yes-for-downloads
          --output-dir=dist
          --enable-plugin=pyside6
          --noinclude-qt-translations
          --include-data-dir=web=web
          --include-data-files=app.ico=app.ico
          --macos-app-icon=app.icns
          --python-flag=no_asserts
          --python-flag=no_docstrings
          --lto=yes
          --nofollow-import-to=PySide6.Qt3DCore
          --nofollow-import-to=PySide6.Qt3DRender
          --nofollow-import-to=PySide6.QtQml
          --nofollow-import-to=PySide6.QtQuick
          --nofollow-import-to=PySide6.QtSql
          --nofollow-import-to=PySide6.QtSensors
          --nofollow-import-to=PySide6.QtBluetooth
          --nofollow-import-to=PySide6.QtNfc
          --nofollow-import-to=PySide6.QtMultimedia
          --nofollow-import-to=PySide6.QtMultimediaWidgets
          --nofollow-import-to=PySide6.QtPositioning
          --nofollow-import-to=PySide6.QtTest
          --nofollow-import-to=PySide6.QtXml
          main.py

      - name: Verify minimum macOS version
        if: runner.os == 'macOS'
        run: |
          cd dist
          if [ -d "main.app" ]; then
            APP_DIR="main.app/Contents"
            echo "==== Highest minos across all bundled binaries ===="
            find "$APP_DIR" -type f \( -name "*.dylib" -o -name "*.so" -o -name "Python" \) -print0 | \
            while IFS= read -r -d '' f; do
              v=$(otool -l "$f" 2>/dev/null | awk '/LC_VERSION_MIN_MACOSX/{f=1} /LC_BUILD_VERSION/{f=1} f&&/minos|version/{print $2; f=0}')
              echo "$v  $f"
            done | sort -rn | head -20
          fi

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd dist
          if [ -d "main.app" ]; then mv main.app BASpark.app; fi
          zip -ry ../${{ matrix.artifact_name }}.zip BASpark.app

      - name: Upload Windows Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: "BASpark.exe"

      - name: Upload macOS Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: "*.zip"